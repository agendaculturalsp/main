  { id: "e-atoto-oficina", period: "5, 12, 19 e 26/08, sempre às 20h30", title: "Atotô — Silêncio, o Rei Está na Terra", venue: "Teatro Oficina, Bixiga", cat: "teatro", desc: "Remontagem da Cia Odara homenageia Obaluaê com elenco de cerca de 40 artistas, no mês em que o teatro completa 63 anos.", highlight: true },
  { id: "e-ia-infraestrutura", period: "A partir de 06/08", title: "Exposição internacional — infraestrutura da IA", venue: "Sesc 24 de Maio", cat: "expo", desc: "Mostra inédita no Brasil revela a infraestrutura física e os impactos invisíveis da inteligência artificial no mundo.", highlight: false },
  { id: "e-riscadura-fogo", period: "Até 02/08", title: "Riscadura de Fogo — Jorge dos Anjos", venue: "Sesc Pompeia", cat: "expo", desc: "Últimos dias desta exposição de escultura em ferro do artista mineiro, na área de convivência.", highlight: false },
  { id: "e-ccbb-fecha", period: "Até 03/08", title: "Atlântico Sertão / Pele Azul", venue: "CCBB São Paulo", cat: "expo", desc: "Últimos dias destas duas exposições — confirmado no site oficial, ambas encerram no mesmo dia.", highlight: false },
  { id: "e-cantrizes", period: "14–17/08", title: "Cantrizes — atrizes que cantam", venue: "Sesc Pompeia", cat: "teatro", desc: "Alessandra Maestrini, Letícia Soares, Virginia Rosa e Letícia Sabatella em shows autorais que unem atuação e música.", highlight: false },
  { id: "e-ccsp-semana", period: "Programação renovada semanalmente", title: "Agenda gratuita do CCSP", venue: "CCSP, Vergueiro", cat: "teatro", desc: "'Pèrègun – A Nativa' (dança indígena, 1–3/08) e 'Contos Originários: Lili Canta Histórias' (23–24/08) são dois destaques de uma grade semanal renovada, toda gratuita.", highlight: false },
  { id: "e-japanhouse-continua", period: "Em cartaz o mês todo", title: "Shiro: uma escala de nuances + KIGUMI", venue: "Japan House SP", cat: "expo", desc: "'Shiro' explora a cor branca na estética japonesa; 'KIGUMI' revela técnicas de junta de madeira sem pregos. Agenda de agosto tem palestra sobre papel artesanal (11/08) e clube de leitura (27/08).", highlight: false },
];

const ALL_LIST_EVENTS = [...ALL_EVENTS, ...ONGOING];

// ---------------------------------------------------------------------------

function Tag({ cat }) {
  const s = CATEGORY_STYLES[cat];
  return (
    <span style={{
      display: "inline-block", fontFamily: "var(--font-heading)", fontWeight: 700,
      fontSize: "10.5px", letterSpacing: "0.06em", textTransform: "uppercase",
      padding: "3px 8px", background: s.bg, color: s.fg,
    }}>
      {s.label}
    </span>
  );
}

function HeartButton({ isFav, onToggleFav }) {
  return (
    <button
      onClick={onToggleFav}
      aria-label={isFav ? "Remover dos favoritos" : "Salvar nos favoritos"}
      style={{
        border: "none", background: "none", cursor: "pointer", padding: 4,
        flexShrink: 0, fontSize: 18, color: isFav ? "var(--color-accent)" : "var(--color-neutral-400)",
      }}
    >
      ♥
    </button>
  );
}

function Card({ ev, dateOrPeriod, isPeriod, isFav, onToggleFav }) {
  return (
    <div style={{
      borderBottom: "2px solid var(--color-divider)", padding: "20px 0",
      display: "flex", gap: 12,
    }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
          <Tag cat={ev.cat} />
          {!isPeriod && (
            <span style={{ fontSize: 11, letterSpacing: "0.05em", color: "var(--color-neutral-700)", textTransform: "uppercase" }}>
              {dateOrPeriod}
            </span>
          )}
        </div>
        <h3 style={{ margin: "0 0 6px", fontFamily: "var(--font-heading)", fontWeight: 800, textTransform: "uppercase", fontSize: 19, lineHeight: 1.15 }}>
          {ev.title}
        </h3>
        <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.03em", textTransform: "uppercase", color: "var(--color-neutral-800)", marginBottom: isPeriod ? 4 : 8 }}>
          {ev.venue}
        </div>
        {isPeriod && (
          <div style={{ fontSize: 11, fontWeight: 700, color: "var(--color-accent-700)", marginBottom: 8, textTransform: "uppercase" }}>
            {dateOrPeriod}
          </div>
        )}
        <p style={{ margin: 0, fontSize: 14, lineHeight: 1.55, color: "var(--color-neutral-900)" }}>{ev.desc}</p>
      </div>
      <HeartButton isFav={isFav} onToggleFav={onToggleFav} />
    </div>
  );
}

function App() {
  const [weekIdx, setWeekIdx] = useState(0);
  const [view, setView] = useState("semana");
  const [favorites, setFavorites] = useState(new Set());
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("agenda-cultural:favoritos");
      if (raw) setFavorites(new Set(JSON.parse(raw)));
    } catch (e) {
      // sem favoritos salvos ainda
    } finally {
      setLoaded(true);
    }
  }, []);

  const toggleFav = (id) => {
    const next = new Set(favorites);
    next.has(id) ? next.delete(id) : next.add(id);
    setFavorites(next);
    try {
      localStorage.setItem("agenda-cultural:favoritos", JSON.stringify([...next]));
    } catch (e) {
      console.error("Não foi possível salvar o favorito agora.", e);
    }
  };

  const highlights = useMemo(() => ALL_LIST_EVENTS.filter((e) => e.highlight), []);
  const favEvents = useMemo(() => ALL_LIST_EVENTS.filter((e) => favorites.has(e.id)), [favorites]);
  const currentWeek = WEEKS[weekIdx];

  const tabs = [
    { key: "semana", label: "Semanas" },
    { key: "cartaz", label: "Em Cartaz" },
    { key: "destaques", label: "Destaques" },
    { key: "favoritos", label: "Favoritos" },
  ];

  return (
    <div style={{ minHeight: "100vh", fontFamily: "var(--font-body)", background: "var(--color-bg)", color: "var(--color-text)" }}>
      {/* HEADER */}
      <div style={{ background: "var(--color-neutral-900)", padding: "32px 20px 16px" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 8, borderBottom: "2px solid var(--color-bg)", paddingBottom: 12 }}>
            <h1 style={{ fontSize: "clamp(30px, 5vw, 52px)", lineHeight: 0.95, textTransform: "uppercase", letterSpacing: "-0.01em", color: "var(--color-bg)" }}>
              Agenda Cultural
            </h1>
            <div style={{ fontFamily: "var(--font-heading)", fontWeight: 700, color: "var(--color-accent-400)", fontSize: 13, letterSpacing: "0.14em", textTransform: "uppercase" }}>
              Centro de São Paulo
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, paddingTop: 12 }}>
            <div style={{ fontFamily: "var(--font-heading)", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", color: "var(--color-neutral-200)", fontSize: 14 }}>
              {MONTH_LABEL} de {YEAR_LABEL}
            </div>
            <div style={{ fontSize: 12, color: "var(--color-neutral-400)" }}>Atualizado em {LAST_UPDATED}</div>
          </div>
        </div>
      </div>

      {/* TABS */}
      <div style={{ borderBottom: "2px solid var(--color-divider)", position: "sticky", top: 0, zIndex: 10, background: "var(--color-bg)" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto", display: "flex", overflowX: "auto" }}>
          {tabs.map((t) => (
            <button key={t.key} onClick={() => setView(t.key)} style={{
              flex: "1", minWidth: 110, padding: "14px 10px", fontFamily: "var(--font-heading)",
              fontWeight: 700, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em",
              border: "none", background: "none", cursor: "pointer",
              borderBottom: `2px solid ${view === t.key ? "var(--color-accent)" : "transparent"}`,
              color: view === t.key ? "var(--color-text)" : "var(--color-neutral-700)",
            }}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* CONTENT */}
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "0 20px 64px" }}>
        {view === "semana" && (
          <React.Fragment>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "24px 0 16px" }}>
              <button onClick={() => setWeekIdx((i) => Math.max(0, i - 1))} disabled={weekIdx === 0}
                style={{ border: "2px solid var(--color-divider)", background: "none", width: 36, height: 36, fontSize: 16, cursor: "pointer", color: "var(--color-text)", opacity: weekIdx === 0 ? 0.3 : 1 }}>
                ←
              </button>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontFamily: "var(--font-heading)", fontWeight: 800, textTransform: "uppercase", fontSize: 22 }}>{currentWeek.label}</div>
                <div style={{ fontSize: 12, color: "var(--color-neutral-700)" }}>{currentWeek.range}</div>
              </div>
              <button onClick={() => setWeekIdx((i) => Math.min(WEEKS.length - 1, i + 1))} disabled={weekIdx === WEEKS.length - 1}
                style={{ border: "2px solid var(--color-divider)", background: "none", width: 36, height: 36, fontSize: 16, cursor: "pointer", color: "var(--color-text)", opacity: weekIdx === WEEKS.length - 1 ? 0.3 : 1 }}>
                →
              </button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(380px, 1fr))", gap: "0 32px" }}>
              {currentWeek.events.map((ev) => (
                <Card key={ev.id} ev={ev} dateOrPeriod={ev.date} isPeriod={false} isFav={favorites.has(ev.id)} onToggleFav={() => toggleFav(ev.id)} />
              ))}
            </div>
            {weekIdx === WEEKS.length - 1 && (
              <div style={{ marginTop: 28, border: "2px solid var(--color-divider)", padding: 20 }}>
                <div style={{ fontFamily: "var(--font-heading)", fontWeight: 700, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: "var(--color-neutral-700)", marginBottom: 12 }}>
                  Fique de olho — sem agenda confirmada
                </div>
                {WATCHLIST.map((w) => (
                  <div key={w.name} style={{ fontSize: 13, marginBottom: 8, lineHeight: 1.5 }}>
                    <span style={{ fontWeight: 700 }}>{w.name}: </span>
                    <span style={{ color: "var(--color-neutral-700)" }}>{w.note}</span>
                    {w.url && (
                      <React.Fragment>
                        {" "}
                        <a href={w.url} target="_blank" rel="noopener noreferrer">Ver site ↗</a>
                      </React.Fragment>
                    )}
                  </div>
                ))}
              </div>
            )}
          </React.Fragment>
        )}

        {view === "cartaz" && (
          <div>
            <p style={{ fontSize: 12, color: "var(--color-neutral-700)", padding: "20px 0 4px" }}>
              Exposições, peças e agendas contínuas que seguem por mais de uma semana.
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(380px, 1fr))", gap: "0 32px" }}>
              {ONGOING.map((ev) => (
                <Card key={ev.id} ev={ev} dateOrPeriod={ev.period} isPeriod={true} isFav={favorites.has(ev.id)} onToggleFav={() => toggleFav(ev.id)} />
              ))}
            </div>
          </div>
        )}

        {view === "destaques" && (
          <div>
            <p style={{ fontSize: 12, color: "var(--color-neutral-700)", padding: "20px 0 4px" }}>
              O que não perder este mês, em qualquer semana.
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(380px, 1fr))", gap: "0 32px" }}>
              {highlights.map((ev) => (
                <Card key={ev.id} ev={ev} dateOrPeriod={ev.date || ev.period} isPeriod={!ev.date} isFav={favorites.has(ev.id)} onToggleFav={() => toggleFav(ev.id)} />
              ))}
            </div>
          </div>
        )}

        {view === "favoritos" && (
          <div>
            {!loaded ? (
              <p style={{ fontSize: 13, color: "var(--color-neutral-400)", padding: "48px 0", textAlign: "center" }}>Carregando...</p>
            ) : favEvents.length === 0 ? (
              <div style={{ textAlign: "center", padding: "64px 20px" }}>
                <div style={{ fontSize: 32, color: "var(--color-neutral-400)", marginBottom: 8 }}>♡</div>
                <p style={{ fontSize: 13, color: "var(--color-neutral-700)" }}>Toque no coração de um evento para salvá-lo aqui.</p>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(380px, 1fr))", gap: "0 32px", paddingTop: 20 }}>
                {favEvents.map((ev) => (
                  <Card key={ev.id} ev={ev} dateOrPeriod={ev.date || ev.period} isPeriod={!ev.date} isFav={true} onToggleFav={() => toggleFav(ev.id)} />
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
